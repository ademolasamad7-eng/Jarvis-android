name: Build JARVIS APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract JARVIS project
        run: |
          unzip -q JARVIS_6_ANDROID_IRON_MAN.zip -d jarvis-project

      - name: Find Gradle wrapper
        run: |
          find jarvis-project -name gradlew -type f

      - name: Build APK
        working-directory: jarvis-project
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-APK
          path: "jarvis-project/**/build/outputs/apk/**/*.apk"
